name: Rustanim CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (Off-VPS CI)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check code formatting and compilation
      run: |
        cargo check --verbose

    - name: Run test suite
      run: |
        cargo test --verbose

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify progress map generator
      run: |
        python3 tools/progress.py
        git diff --exit-code || echo "Progress files up to date"
